# Tells Bing (and other IndexNow search engines) about every page whenever the site changes.
name: Notify Bing (IndexNow)
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit sitemap URLs
        run: |
          KEY=4fe44b503bf1d9bbe965162b7ee3a2a5
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "Submitting: $URLS"
          BODY=$(printf '{"host":"loopcast.space","key":"%s","keyLocation":"https://loopcast.space/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          CODE=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow answered HTTP $CODE"; cat resp.txt || true
          # 200 = accepted, 202 = accepted (key check pending)
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ]
